# Netlify-konfigurasjon for en ren statisk side.
# Ingen bygging – serverer index.html fra repo-roten direkte.

[build]
  publish = "."
  command = ""

# Blokker interne prosjektdokumenter fra offentlig visning.
# (De ligger i repoet for arbeidsflyt, men skal ikke serveres paa nett.)
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/SPEC.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/ISSUES.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/AUDIT_REPORT.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/DARK_MODE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/PROJECT.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/TEST_INFRA.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/security_audit.md"
  to = "/"
  status = 404
  force = true

# Blokker verktøyfiler og konfig fra offentlig visning.
[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/link-checker-report.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/"
  status = 404
  force = true

# Egendefinert 404-side som siste catch-all.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ─── Sikkerhetsheadere ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ─── Cache-headere for statiske ressurser ───
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
