<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siden finnes ikke | Lars Erik Brekne Johnsen</title>
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: 4rem;
            font-weight: 600;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .error-text {
            font-size: 0.95rem;
            color: var(--muted);
            max-width: 40ch;
            margin-bottom: 1.5rem;
        }
        .error-link {
            display: inline-block;
            text-decoration: none;
            font-size: 0.88rem;
            border: 1px solid var(--accent-color);
            padding: 0.5rem 1rem;
            color: var(--accent-color);
            transition: border-color 0.2s, color 0.2s, background-color 0.2s;
        }
        .error-link:hover,
        .error-link:focus-visible {
            background-color: var(--accent-color);
            color: #fff;
        }
        .error-link:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Denne siden finnes ikke</h1>
        <p class="error-text">Beklager – siden du leter etter er flyttet, slettet eller har aldri eksistert.</p>
        <a class="error-link" href="/">Tilbake til forsiden</a>
    </div>
</body>
</html>
